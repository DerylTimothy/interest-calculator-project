<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Simple Interest and Total Payable Amount Calculator web application">
    <meta name="keywords" content="Simple Interest, Calculator, Finance, Interest Rate, Total Payable">
    <title>Simple Interest Calculator</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Simple Interest Calculator</h1>
        <form id="interest-form">
            <div class="form-group">
                <label for="principal">Principal Amount ($):</label>
                <input type="number" id="principal" placeholder="Enter principal amount" required>
            </div>
            <div class="form-group">
                <label for="rate">Annual Interest Rate (%):</label>
                <input type="number" id="rate" step="0.01" placeholder="Enter interest rate" required>
            </div>
            <div class="form-group">
                <label for="time">Time (Years):</label>
                <input type="number" id="time" step="0.01" placeholder="Enter time in years" required>
            </div>
            <button type="button" id="calculate-btn" onclick="calculate()">Calculate</button>
        </form>
        <div id="result">
            <p>Simple Interest: <span id="simple-interest">0</span></p>
            <p>Total Payable Amount: <span id="total-payable">0</span></p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
